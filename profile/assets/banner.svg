<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">J.A.R.V.I.S. Hub</title>
  <desc id="desc">Banner del laboratorio J.A.R.V.I.S. Hub: progetti e assistenti ispirati a Iron Man.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/>
      <stop offset="0.55" stop-color="#07111a"/>
      <stop offset="1" stop-color="#030508"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4dd8ff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#4dd8ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#4dd8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c8f6ff"/>
      <stop offset="0.7" stop-color="#4dd8ff"/>
      <stop offset="1" stop-color="#0a6f8f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7a18"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4dd8ff" stroke-width="0.6" opacity="0.09"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <ellipse cx="1040" cy="180" rx="330" ry="240" fill="url(#glow)" opacity="0.35"/>
  <rect width="1280" height="360" fill="url(#scan)"/>

  <g stroke="#4dd8ff" stroke-width="1.5" opacity="0.55" fill="none">
    <path d="M24 60V24h36"/>
    <path d="M1256 60V24h-36"/>
    <path d="M24 300v36h36"/>
    <path d="M1256 300v36h-36"/>
  </g>

  <g transform="translate(1040 180)">
    <circle r="150" fill="url(#glow)" opacity="0.5" filter="url(#blur)"/>
    <circle r="132" fill="none" stroke="#ffb347" stroke-width="1.5" stroke-dasharray="2 10" opacity="0.5"/>
    <circle r="116" fill="none" stroke="#4dd8ff" stroke-width="1" opacity="0.25"/>
    <circle r="104" fill="none" stroke="#4dd8ff" stroke-width="2" stroke-dasharray="3 14" opacity="0.6"/>
    <g stroke="#4dd8ff" stroke-width="7" opacity="0.8" stroke-linecap="round">
      <line x1="0" y1="-98" x2="0" y2="-64" transform="rotate(0)"/>
      <line x1="0" y1="-98" x2="0" y2="-64" transform="rotate(36)"/>
      <line x1="0" y1="-98" x2="0" y2="-64" transform="rotate(72)"/>
      <line x1="0" y1="-98" x2="0" y2="-64" transform="rotate(108)"/>
      <line x1="0" y1="-98" x2="0" y2="-64" transform="rotate(144)"/>
      <line x1="0" y1="-98" x2="0" y2="-64" transform="rotate(180)"/>
      <line x1="0" y1="-98" x2="0" y2="-64" transform="rotate(216)"/>
      <line x1="0" y1="-98" x2="0" y2="-64" transform="rotate(252)"/>
      <line x1="0" y1="-98" x2="0" y2="-64" transform="rotate(288)"/>
      <line x1="0" y1="-98" x2="0" y2="-64" transform="rotate(324)"/>
    </g>
    <circle r="78" fill="none" stroke="#4dd8ff" stroke-width="1.5" opacity="0.55"/>
    <circle r="62" fill="#071a24" stroke="#4dd8ff" stroke-width="2" opacity="0.9"/>
    <circle r="48" fill="url(#core)" opacity="0.9" filter="url(#soft)"/>
    <circle r="36" fill="url(#core)"/>
    <circle r="18" fill="#eaffff" opacity="0.95"/>
    <circle r="8" fill="#ffffff"/>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="1184" y="64" text-anchor="end" fill="#4dd8ff" font-size="10" letter-spacing="3.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" opacity="0.75">SYS.ONLINE</text>
    <text x="96" y="116" fill="#4dd8ff" font-size="13" letter-spacing="4.5" font-family="SFMono-Regular, Menlo, Consolas, monospace">// IRON MAN INSPIRED ENGINEERING</text>
    <text x="96" y="206" fill="#ffffff" font-size="82" font-weight="700" letter-spacing="5">J.A.R.V.I.S. <tspan fill="#ffb347">HUB</tspan></text>
    <text x="96" y="242" fill="#93a9bd" font-size="14" letter-spacing="4.6" font-family="SFMono-Regular, Menlo, Consolas, monospace">JUST A RATHER VERY INTELLIGENT SYSTEM</text>
    <rect x="96" y="268" width="96" height="3" fill="url(#gold)"/>
    <rect x="200" y="269" width="300" height="1" fill="#4dd8ff" opacity="0.35"/>
    <text x="96" y="310" fill="#6f8598" font-size="11" letter-spacing="3" font-family="SFMono-Regular, Menlo, Consolas, monospace">EST. 2026 · PERSONAL AI LAB</text>
    <text x="1040" y="330" text-anchor="middle" fill="#4dd8ff" font-size="10" letter-spacing="3.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" opacity="0.8">ARC REACTOR // 100%</text>
  </g>
</svg>
